<!DOCTYPE html>
<html>
<head>

    <title>Billing</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='billing.css') }}">

</head>

<body>

<div class="container">

    <h1>Restaurant Billing</h1>

    <div class="billing-card">

        <form action="/generate_bill" method="POST">

            <input
                type="text"
                name="customer_name"
                placeholder="Customer Name"
                required>

            <h3>Menu</h3>

            <div class="menu-item">

                <label>Burger (₹200)</label>

                <input
                type="number"
                name="burger"
                value="0"
                min="0">

            </div>

            <div class="menu-item">

                <label>Pizza (₹350)</label>

                <input
                type="number"
                name="pizza"
                value="0"
                min="0">

            </div>

            <div class="menu-item">

                <label>Pasta (₹250)</label>

                <input
                type="number"
                name="pasta"
                value="0"
                min="0">

            </div>

            <div class="menu-item">

                <label>Fries (₹150)</label>

                <input
                type="number"
                name="fries"
                value="0"
                min="0">

            </div>

            <button type="submit">
                Generate Bill
            </button>

        </form>

    </div>

    {% if total %}

    <div class="result">

        <h2>Bill Generated</h2>

        <p><strong>Customer:</strong> {{ customer }}</p>

        <p><strong>Total Amount:</strong> ₹{{ total }}</p>

    </div>

    {% endif %}

</div>

</body>
</html>
