<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TQM RMS - Billing</title><link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='billing.css') }}"></head>
<body><aside class="sidebar"><h2>🍽️ TQM RMS</h2>
<a href="/" class="">Dashboard</a><a href="/orders" class="">Orders</a><a href="/billing" class="active">Billing</a><a href="/waiter" class="">Waiter</a><a href="/analytics" class="">Analytics</a><a href="/feedback" class="">Feedback</a><a href="/accessibility" class="">Accessibility</a></aside>
<main class="main"><div class="top"><h1>Billing</h1><button class="btn" onclick="toggleDark()">🌙 Dark Mode</button></div>
<div class="grid2"><div class="card"><h3>Select Order</h3><select id="orderSel">{% for o in orders %}<option value="{{ o.id }}" data-amt="{{ o.amount }}" data-cust="{{ o.customer }}" data-items="{{ o.items }}">#{{ o.id }} - {{ o.customer }} - ₹{{ o.amount }}</option>{% endfor %}</select><label>Discount (₹)</label><input id="disc" type="number" value="0" oninput="calcBill()"><div id="calc"></div><button class="btn" onclick="genBill()">Generate Bill</button><p id="msg"></p></div><div class="card"><h3>Bill Preview</h3><div id="preview">Select order</div></div></div><div class="card"><h3>All Bills</h3>{% for b in bills %}<p>Bill #{{ b.id }} - {{ b.customer }} - ₹{{ b.total }} - {{ b.bill_date }}</p>{% endfor %}</div></main><script src="{{ url_for('static', filename='script.js') }}"></script><script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
